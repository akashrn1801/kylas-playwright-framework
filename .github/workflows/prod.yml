name: CI — prod (prod-safe tests)
# WHY: Jenkins owns prod and main branches exclusively.
# GitHub Actions is disabled for push/PR on these branches to prevent
# double execution. Jenkins Jenkinsfile.prod handles prod with approval gate.
# workflow_dispatch kept for emergency manual runs only.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running against Prod?'
        required: true
        default: 'Manual verification'
# WHY one workflow-level concurrency group PER ACCOUNT, never cancelling (ADR 0009):
# runs of these workflows share one account whose form-field
# configuration is account-wide, so overlapping runs on it can corrupt each other's
# limits (the cross-shard race in docs/known-issues/sharding-and-locks.md, one
# level up). `kylas-prod` is shared by main.yml and prod.yml, which both drive the same prod
# account. dev.yml is deliberately NOT in any group.
# `cancel-in-progress: false` makes a
# newer run WAIT for the running one instead of killing it.
# GitHub caveat: a group holds ONE running and ONE pending run. A third run
# arriving while one is pending CANCELS the pending one (it never starts and
# sends no email). Only workflows in this repository are covered; a Jenkins job
# on the same account is not.
concurrency:
  group: kylas-prod
  cancel-in-progress: false

jobs:
  run-tests:
    name: playwright-ci
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # WHY bounded (2026-10-08): run 37669596623 hung 3h in apt-get update here. Per-attempt
      # timeout + 3 attempts live in the script; step timeout is the backstop.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bash .github/scripts/install-playwright-browsers.sh --with-deps
      - name: Run prod-safe tests
        env:
          ENV: prod
          CI: true
          NAVIGATION_TIMEOUT: 120000
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          PROD_RESTRICTED_EMAIL: ${{ secrets.PROD_RESTRICTED_EMAIL }}
          PROD_RESTRICTED_PASSWORD: ${{ secrets.PROD_RESTRICTED_PASSWORD }}
          # WHY (2026-09-04): estimate-duration's own git fetch of
          # ci/reporting-history needs this — same root cause as
          # syncHistory.ts's own credential requirement below.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          START_TIME=$(date +%s)
          echo "⏱️  Started at: $(date '+%H:%M:%S')"
          WORKERS=2 npm run estimate-duration --silent || true
          npx playwright test --project=chromium --grep @prodSafe --workers=2 --timeout=90000
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          echo "✅ Total time: ${MINUTES}m ${SECONDS}s"
          exit $EXIT_CODE
      # WHY: see qa.yml for the full explanation — must run before notify so its
      # delta output exists in time for the email; never fails the build.
      - name: Sync run history
        if: always()
        env:
          ENV: prod
          GITHUB_ACTIONS: 'true'
          REPORT_PATH: reports/playwright-report/results.json
          # WHY (2026-09-04): must match the real --workers value the "Run
          # prod-safe tests" step above just used — see
          # docs/known-issues/ci-pipelines.md's dynamic-duration-estimate entry.
          WORKERS: '2'
          # WHY (2026-08-25): syncHistory.ts's own temp clone needs its own
          # credential — see docs/known-issues/reporting-and-notifications.md's "CI reporting-history
          # ledger" section for the confirmed root cause.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: npm run history:sync || true

      - name: Send notification email
        if: always()
        env:
          ENV: prod
          # WHY (2026-09-29): Phase 3 items #1/#6 — see dev.yml's identical
          # comment for the full reasoning.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SMTP_HOST: smtp.gmail.com
          GMAIL_SMTP_PORT: '587'
          NOTIFY_ENABLED: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run notify || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-prod
          path: reports/playwright-report/
          retention-days: 30
