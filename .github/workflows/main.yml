name: CI — main (full validation)

# WHY: Jenkins owns prod and main branches exclusively.
# GitHub Actions is disabled for push/PR on these branches to prevent
# double execution. Jenkins Jenkinsfile handles main with approval gate.
# workflow_dispatch kept for emergency manual runs only.
on:
  workflow_dispatch:

jobs:
  run-tests:
    name: playwright-ci
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run full validation suite
        env:
          ENV: prod
          CI: true
          NAVIGATION_TIMEOUT: 120000
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          PROD_RESTRICTED_EMAIL: ${{ secrets.PROD_RESTRICTED_EMAIL }}
          PROD_RESTRICTED_PASSWORD: ${{ secrets.PROD_RESTRICTED_PASSWORD }}
          # WHY (2026-09-04): estimate-duration's own git fetch of
          # ci/reporting-history needs this — same root cause as
          # syncHistory.ts's own credential requirement below.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          START_TIME=$(date +%s)
          echo "⏱️  Started at: $(date '+%H:%M:%S')"
          WORKERS=2 npm run estimate-duration --silent || true
          npx playwright test --project=chromium --workers=2 --timeout=90000
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          echo "✅ Total time: ${MINUTES}m ${SECONDS}s"
          exit $EXIT_CODE

      # WHY: Confirmed live (2026-07-07 reporting overhaul) — additional bug found
      # while wiring history sync, same root cause as NotificationService.ts's
      # MISC_ERRORS_PATH fix: this step previously set ENV: qa while the actual
      # test run above uses ENV: prod, so this workflow's email has never
      # correctly read its own run's misc-errors.json — it was looking in
      # reports/qa/ while the run wrote to reports/prod/. Fixed to match.
      - name: Sync run history
        if: always()
        env:
          ENV: prod
          GITHUB_ACTIONS: 'true'
          REPORT_PATH: reports/playwright-report/results.json
          # WHY (2026-09-04): must match the real --workers value the "Run
          # full validation suite" step above just used — see
          # .claude/known-issues.md's dynamic-duration-estimate entry.
          WORKERS: '2'
          # WHY (2026-08-25): syncHistory.ts's own temp clone needs its own
          # credential — see .claude/known-issues.md's "CI reporting-history
          # ledger" section for the confirmed root cause.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: npm run history:sync || true

      - name: Send notification email
        if: always()
        env:
          ENV: prod
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SMTP_HOST: smtp.gmail.com
          GMAIL_SMTP_PORT: '587'
          NOTIFY_ENABLED: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run notify || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-main
          path: reports/playwright-report/
          retention-days: 90
