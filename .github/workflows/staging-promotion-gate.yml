# WHY: Confirmed live (2026-07-07 reporting overhaul, P5) — renamed from
# staging.yml. That name was near-identical to stage.yml (the actual push-
# triggered CI for the `stage` branch) despite being a completely different
# pipeline — manual-only, runs against STAGING_* secrets, and gates an
# approval-based auto-merge of `staging` into `prod`. The near-identical
# names were a standing source of confusion (see CLAUDE.md's CI/CD table).
#
# TRIGGER: manual only (workflow_dispatch) — never runs on push.
# RESPONSIBILITY: run the full suite against the Staging environment, then —
# only if that passes and a human approves via the `production-approval`
# GitHub Environment gate — auto-merge `staging` into `prod` with no further
# review. Given that blast radius, a failure here must never go unnoticed;
# see the "Send notification email" step below, added in this same change —
# this pipeline previously had NO failure notification at all.
name: Staging → Prod Promotion Gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual staging pipeline run'
        required: false

jobs:
  test-staging:
    name: Run Staging Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run tests against Staging
        env:
          CI: true
          ENV: staging
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          STAGING_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
          DEFAULT_TIMEOUT: 30000
          NAVIGATION_TIMEOUT: 90000
          EXPECT_TIMEOUT: 20000
          HEADLESS: true
          WORKERS: 2
          RETRY_COUNT: 1
        run: npx playwright test --project=chromium

      # WHY: Confirmed live (2026-07-07 reporting overhaul, P5) — this pipeline
      # previously had NO failure-notification step at all, despite gating an
      # unattended auto-merge into prod behind only a manual approval click. A
      # failing staging run was visible only to someone who happened to check
      # the Actions tab. `if: always()` so a failure is reported the same as a
      # pass — silence on failure is exactly the gap being closed here.
      - name: Sync run history
        if: always()
        env:
          ENV: staging
          GITHUB_ACTIONS: 'true'
          REPORT_PATH: reports/playwright-report/results.json
          # WHY (2026-08-25): syncHistory.ts's own temp clone needs its own
          # credential — see .claude/known-issues.md's "CI reporting-history
          # ledger" section for the confirmed root cause.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: npm run history:sync || true

      - name: Send notification email
        if: always()
        env:
          ENV: staging
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SMTP_HOST: smtp.gmail.com
          GMAIL_SMTP_PORT: '587'
          NOTIFY_ENABLED: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run notify || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-playwright-report
          path: |
            reports/playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  approve-prod:
    name: Approval Gate — Prod
    needs: test-staging
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - name: Approved for Prod
        run: echo "Approved — promoting to prod"

  promote-to-prod:
    name: Promote to Prod
    needs: approve-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_TOKEN }}
      - name: Merge staging into prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout prod
          git merge origin/staging --no-ff -m "chore: auto-promote staging to prod [skip ci]"
          git push origin prod
