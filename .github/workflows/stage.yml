# WHY: Confirmed live (2026-07-07 reporting overhaul, P5) — this file's name is
# easily confused with staging-promotion-gate.yml (formerly staging.yml). They
# are NOT the same pipeline:
#
# TRIGGER: push to the `stage` branch (also manually via workflow_dispatch).
# RESPONSIBILITY: ordinary CI for that branch — run the full suite against QA-
# style credentials/env, report results, upload artifacts. No approval gate,
# no auto-merge, no promotion to anywhere. If you're looking for the pipeline
# that gates merging into prod, that's staging-promotion-gate.yml, not this one.
name: CI — stage (full suite)

on:
  push:
    branches: [stage]
  workflow_dispatch:

# WHY sharded across a DYNAMICALLY-COMPUTED number of parallel jobs
# (redesigned 2026-09-09, was a fixed 4): the previous single-job, no-`--grep`
# full-suite run was killed by GitHub Actions' hard, non-configurable
# 6-hour-per-job execution ceiling on 2026-09-08 (run 34256174792, killed at
# 6h02m10s elapsed, still mid-suite). Two OLDER stage runs (2026-09-03,
# 2026-09-04) were also killed by this same ceiling — see
# docs/known-issues/sharding-and-locks.md's dated 2026-09-09 entry, which also explains why
# sharding was chosen over worker-tuning (blocked by the documented
# --workers=1 credential-race risk) or a self-hosted runner (a bigger infra
# change, not needed once sharding alone clears the ceiling with large
# margin).
#
# WHY dynamic, not a fixed 4 (redesigned 2026-09-09, same day as the initial
# fix — an inconsistency once sandbox.yml's own dynamic-matrix pattern
# already existed in this repo, not a deliberate choice): a fixed shard count
# has a real, calculable expiration point as the suite grows (verified: 4
# shards approach the hard 360-min ceiling around ~1987 tests, ~3.9x today's
# size) — safely distant today (2.7-7+ years at real observed growth rates)
# but not something to leave static when GitHub Actions' `fromJSON()` matrix
# pattern genuinely supports full dynamism with no platform constraint
# blocking it (unlike the Jenkins outer-timeout case). The `plan` job below
# computes shard count LIVE from the real current full-suite test count every
# run, via `shardCount = ceil(testCount / 125)` — 125 tests/shard was derived
# from this exact incident's own measured throughput (qa.yml's identical-
# infra 499 tests / 361.58 min at --workers=2 = 1.380 tests/min) targeting
# ~90 min/shard, verified live against this workflow's real 515-test count
# (-> 5 shards, ~74.6 min/shard projected — MORE margin than the original
# fixed-4 design's ~93 min/shard, not less, since dynamic computation
# correctly gives this larger-scope workflow one more shard than qa.yml's
# smaller @regression-only scope, rather than forcing both to share the same
# number). If the suite doubles, triples, or shrinks, this recomputes
# correctly with ZERO manual intervention. The remaining residual risk (the
# 125-tests/shard constant itself assumes today's per-test throughput; a
# material slowdown in average per-test duration, independent of test COUNT,
# could still erode the margin) is the same class of risk already knowingly
# accepted for Jenkinsfile's own `secondsPerTest` rate constant — not new,
# not hidden.
#
# WHY file-atomic bin-packing (scripts/plan-shards.ts), not raw count-based
# `--shard=N/M` any more (2026-09-29): `--shard=N/M` is Playwright's own
# internal splitter — it slices the discovered test list purely by count,
# with zero awareness of file boundaries or shared state. That's the exact
# mechanism that caused the formFields cross-shard config-mutation race (see
# docs/known-issues/sharding-and-locks.md's dated 2026-09-29 entry) — formFields got a
# hand-built fixed-matrix carve-out to route around it, but nothing
# structurally prevented the NEXT feature with shared, account-wide mutable
# state from hitting the identical bug, short of a human remembering to
# hand-build another one-off carve-out every time. `scripts/plan-shards.ts`
# replaces the count-based split for this "rest of suite" track with a
# discovery-and-bin-pack planner that treats each spec FILE as the atomic
# unit — never splits one file across two shards — while still targeting the
# same 125-tests/shard budget. It EXCLUDES formFields' 12 files via a
# hardcoded path-prefix check (never a flag a caller could omit) — formFields
# keeps using its own separately-verified fixed 6-shard matrix
# (run-formfields-tests below), untouched by this planner. Verified via real
# `--list` runs before this shipped: zero formFields files ever appear in
# this planner's own output. Full design/verification history:
# docs/known-issues/sharding-and-locks.md's dated 2026-09-29 "Dynamic per-module shard
# planner" entry.
jobs:
  plan:
    name: compute shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shard_total: ${{ steps.compute.outputs.shard_total }}
      shards_json: ${{ steps.compute.outputs.shards_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute shard plan from the real current full-suite test count
        id: compute
        # WHY this env block exists (2026-09-09, fixing a real CI failure on
        # this fix's own first live run — qa run 34331488056, same root
        # cause applies identically here): `npx playwright test --list`
        # requires playwright.config.ts, which requires config/config.ts —
        # and that module throws synchronously at load time (before a
        # single test is discovered) if the active env's APP_URL/
        # ADMIN_EMAIL/ADMIN_PASSWORD/RESTRICTED_EMAIL/RESTRICTED_PASSWORD
        # aren't set, since its exported config object evaluates
        # requireEnv() eagerly. This step never had these secrets wired in
        # (only the full-suite run job below did) — confirmed via direct
        # local reproduction (`Error: Missing required environment
        # variable: QA_APP_URL` at config/config.ts:27, since ENV defaults
        # to 'qa' when unset). scripts/plan-shards.ts's own failure path
        # (the `fail()` helper) preserves this same "loud, full output,
        # never silently swallowed" behavior.
        env:
          ENV: staging
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          STAGING_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
        # WHY scripts/plan-shards.ts, not the old inline bash arithmetic
        # (2026-09-29): see this workflow's own top-of-file WHY comment for
        # the full file-atomic-bin-packing rationale. The script writes
        # shard_total/shards_json/test_count to $GITHUB_OUTPUT itself. No
        # --grep filter at all here (full-suite scope) — formFields is
        # excluded INSIDE the script via a hardcoded path-prefix check, so
        # no --grep-invert flag is needed on this call either.
        run: npx ts-node scripts/plan-shards.ts

  run-tests:
    name: playwright-ci (shard ${{ matrix.shard.shardId }}/${{ needs.plan.outputs.shard_total }})
    needs: plan
    runs-on: ubuntu-latest
    # WHY 180 (2026-09-09): each shard now runs ~125 tests (~90 min
    # targeted), so 180 gives a real 2x margin over that while still failing
    # a genuinely stuck/hung shard in 3h instead of silently consuming the
    # full 6h before GitHub's own hard ceiling would eventually kill it
    # anyway with no earlier signal. This stays correct regardless of how
    # many shards the plan job computes, since it bounds one shard's ~125-
    # test share, not the whole suite. stage.yml deliberately never had an
    # explicit timeout-minutes before the original 2026-09-09 sharding fix
    # (see docs/KNOWN_ISSUES_ACTIVE.md's staging-load-contention entry for why).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_json) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run full suite (shard ${{ matrix.shard.shardId }}/${{ needs.plan.outputs.shard_total }})
        env:
          ENV: staging
          CI: true
          NAVIGATION_TIMEOUT: 120000
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          STAGING_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
          QA_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          QA_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          QA_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
          # WHY (2026-09-04): estimate-duration's own git fetch of
          # ci/reporting-history needs this — same root cause as
          # syncHistory.ts's own credential requirement below.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          START_TIME=$(date +%s)
          echo "⏱️  Started at: $(date '+%H:%M:%S')"
          # WHY estimate-duration only on shard 1 (2026-09-09): the historical
          # duration data it reads reflects a full UNSHARDED run's total time
          # — printing it identically on every shard would be redundant and
          # would multiply the read-only git fetch against
          # ci/reporting-history for zero added benefit.
          if [ "${{ matrix.shard.shardId }}" = "1" ]; then
            # WHY workers=2, not 1 (reverted 2026-09-05, unchanged by this
            # sharding fix): --workers=1 was a speculative mitigation applied
            # 2026-09-04 for a documented but NEVER-confirmed intermittent-
            # staging-failures theory, reverted after it roughly doubled this
            # workflow's runtime and itself caused a real 360-min timeout
            # kill — see docs/KNOWN_ISSUES_ACTIVE.md's staging-intermittency
            # entry for the full incident. Sharding and per-shard worker
            # count are independent levers; this fix does not revisit that
            # decision.
            WORKERS=2 npm run estimate-duration --silent || true
          fi
          # WHY --reporter=blob,list,./src/reporters/MiscErrorReporter.ts
          # instead of the config's default reporter array (verified live,
          # 2026-09-09 — see merge.config.ts's own WHY comment for the full
          # reasoning): html/json are deferred to the one-time
          # "merge-and-report" job below, which replays every shard's blob
          # data through them ONCE to produce a single consolidated report
          # instead of N disconnected ones. MiscErrorReporter runs HERE, per
          # shard, because its data comes from THIS shard's own live
          # per-worker temp files — it cannot be usefully re-run later
          # against replayed blob data (confirmed: a merge job's runner never
          # had those temp files in the first place).
          # WHY explicit FILE ARGS instead of --shard=N/M, and no
          # --grep-invert "formFields" any more (2026-09-29): the plan job's
          # scripts/plan-shards.ts already resolved this shard's own exact
          # file list (formFields-free, by hardcoded exclusion inside that
          # script) — passing those files directly is what makes this shard
          # file-atomic. No --grep needed here either (full-suite scope).
          npx playwright test --project=chromium --workers=2 --timeout=120000 \
            ${{ join(matrix.shard.files, ' ') }} \
            --reporter=blob,list,./src/reporters/MiscErrorReporter.ts
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          echo "✅ Shard ${{ matrix.shard.shardId }}/${{ needs.plan.outputs.shard_total }} total time: ${MINUTES}m ${SECONDS}s"
          exit $EXIT_CODE

      # WHY blob-report/ uploaded per shard, then merged by the job below
      # (Playwright's own documented pattern for sharded CI): the blob format
      # self-contains every test's attachments (traces, screenshots, videos),
      # so the merged HTML report built from these still has fully working
      # trace-viewer links with no need to also merge raw test-results/ dirs.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-report-stage-${{ matrix.shard.shardId }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: warn

      # WHY uploaded per shard, aggregated by scripts/merge-misc-errors.ts in
      # the merge job (see that script's own WHY comment): this file is
      # already correct for THIS shard's own workers — it just needs
      # combining with the other shards' files, not regenerating.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: misc-errors-stage-${{ matrix.shard.shardId }}
          path: reports/staging/misc-errors.json
          retention-days: 3
          if-no-files-found: warn

      # WHY: trace.zip/video/screenshots for failed tests land in test-results/
      # (playwright.config.ts outputDir), not the blob report — kept as a raw
      # per-shard artifact for direct access. The merged HTML report above is
      # already self-contained (blob format embeds attachments) and doesn't
      # depend on this to display traces; this is a convenience fallback only.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-test-results-stage-${{ matrix.shard.shardId }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # WHY this job exists, separate from run-tests' own dynamic shard matrix
  # (2026-09-29): confirmed via real sandbox run 36520337903 that formFields'
  # per-entity cross-process config lock (formFieldLockFactory.ts/
  # formFieldsTestLock.ts) is `fs`-based and scoped to ONE runner's own
  # filesystem — it provides zero protection the moment an entity's UI spec
  # file and its RBAC sibling (which target the exact same shared, account-
  # wide dedicated custom fields) land on two DIFFERENT shards, which
  # run-tests' own count-based Playwright sharding does not prevent (see
  # docs/known-issues/sharding-and-locks.md's dated 2026-09-29 entry for the full incident:
  # every one of the 6 entities' UI/RBAC file pairs landed on different
  # shards in that run, producing genuine, evidence-confirmed config-
  # mutation races). Fix: give formFields its own fixed, content-addressed
  # shard plan — one shard per entity, each running that entity's UI+RBAC
  # file pair together, always — rather than relying on Playwright's own
  # opaque, count-based, reshuffle-prone chunking to keep them co-located.
  # This holds regardless of how many shards run-tests itself computes, how
  # the suite grows, or how Playwright's internal grouping behaves in a
  # future version — the pairing is fixed by this matrix, not derived.
  run-formfields-tests:
    name: playwright-formFields (${{ matrix.entity }})
    # WHY sequenced AFTER run-tests, and WHY `!cancelled()` (2026-10-06): the
    # core shards and the 6 formFields shards used to start simultaneously
    # (10-11 concurrent jobs, each hammering the same shared staging/QA
    # backend in globalSetup — see docs/known-issues/rate-limits-and-error-pages.md's 2026-09-29 429
    # entries). Running the tracks back-to-back caps peak concurrency at one
    # track (5-6 jobs) at the cost of ~2x wall-clock. HARD REQUIREMENT: a
    # failed, flaky or skipped core shard must NEVER suppress formFields.
    # `needs: run-tests` alone would apply the implicit `success()` gate and
    # skip this whole job on any core failure; `!cancelled()` replaces it, so
    # this job runs after run-tests finishes in ANY result — success, failure
    # or skipped — and is skipped only when a person cancels the workflow.
    # merge-and-report (below) still `needs` both tracks with `if: always()`.
    needs: [run-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # WHY 180 (2026-09-29): real measured per-entity total test time (this
    # entity's UI+RBAC files combined, first-attempt durations summed from
    # sandbox run 36520337903) ranged ~80-110 min at workers=2 — see
    # docs/known-issues/sharding-and-locks.md's dated 2026-09-29 entry for the full
    # derivation. 180 gives ~1.6-2x margin over the slowest entity (Lead).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        entity: [lead, contact, company, deal, task, productsAndServices]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run formFields tests for ${{ matrix.entity }} (UI + RBAC together, always one shard)
        env:
          ENV: staging
          CI: true
          NAVIGATION_TIMEOUT: 120000
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          STAGING_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
          QA_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          QA_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          QA_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          START_TIME=$(date +%s)
          echo "⏱️  Started at: $(date '+%H:%M:%S')"
          # WHY no --shard/--timeout flag here: this job's own matrix IS the
          # shard plan (fixed, one entity per job) — Playwright's own
          # --shard flag is deliberately never used for this track. Each
          # spec file's own test.describe.configure({ timeout: 480000 })
          # already governs its tests' timeout; no CLI --timeout override
          # is layered on top, matching how these same files already ran
          # under sandbox.yml before this fix.
          npx playwright test --project=chromium --workers=2 \
            tests/ui/formFields/${{ matrix.entity }}FieldLimits.spec.ts \
            tests/rbac/formFields/${{ matrix.entity }}FieldLimits.rbac.spec.ts \
            --reporter=blob,list,./src/reporters/MiscErrorReporter.ts
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          echo "✅ formFields/${{ matrix.entity }} total time: ${MINUTES}m ${SECONDS}s"
          exit $EXIT_CODE

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-report-stage-formfields-${{ matrix.entity }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: misc-errors-stage-formfields-${{ matrix.entity }}
          path: reports/staging/misc-errors.json
          retention-days: 3
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-test-results-stage-formfields-${{ matrix.entity }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # WHY a separate job, not a step in run-tests (this IS the point of
  # sharding): this is the ONE place that produces a single consolidated
  # report/notification, regardless of how many shards ran or how they each
  # individually finished — `if: always()` so a partial/failed/cancelled
  # shard still gets a real report instead of the misleading stale-file
  # fallback that caused the sandbox Build #167 false-"PASSED" incident (see
  # docs/known-issues/sharding-and-locks.md's dated entry — that incident is now also
  # separately hardened in ReportParser.ts/AutomationHealth.ts/
  # EmailTemplate.ts regardless of this sharding change).
  merge-and-report:
    name: merge report + notify
    needs: [run-tests, run-formfields-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all shard blob reports
        uses: actions/download-artifact@v6
        with:
          pattern: blob-report-stage-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge shard reports into one HTML/JSON report
        run: npx playwright merge-reports --config=merge.config.ts ./all-blob-reports

      - name: Download all per-shard misc-errors reports
        uses: actions/download-artifact@v6
        with:
          pattern: misc-errors-stage-*
          path: all-misc-errors

      - name: Aggregate misc-errors.json across all shards
        run: npx ts-node scripts/merge-misc-errors.ts staging all-misc-errors

      # WHY: see qa.yml for the full explanation — must run before notify so its
      # delta output exists in time for the email; never fails the build.
      - name: Sync run history
        if: always()
        env:
          ENV: staging
          GITHUB_ACTIONS: 'true'
          REPORT_PATH: reports/playwright-report/results.json
          # WHY (2026-09-04, value reverted 2026-09-05): must match the real
          # --workers value the shard jobs above just used — see
          # docs/known-issues/ci-pipelines.md's dynamic-duration-estimate entry and the
          # separate workers=1-revert entry for why this is '2'.
          WORKERS: '2'
          # WHY (2026-08-25): syncHistory.ts's own temp clone needs its own
          # credential — see docs/known-issues/reporting-and-notifications.md's "CI reporting-history
          # ledger" section for the confirmed root cause.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: npm run history:sync || true

      - name: Send notification email
        if: always()
        env:
          ENV: staging
          # WHY (2026-09-29): Phase 3 items #1/#6 — see dev.yml's identical
          # comment for the full reasoning.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SMTP_HOST: smtp.gmail.com
          GMAIL_SMTP_PORT: '587'
          NOTIFY_ENABLED: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run notify || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-stage
          path: reports/playwright-report/
          retention-days: 14
