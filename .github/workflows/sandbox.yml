name: CI — sandbox (selective tests)

on:
  push:
    branches: [sandbox]

jobs:
  detect-and-run:
    name: playwright-selective
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Detect changed tests
        id: detect
        env:
          BASE_BRANCH: dev
        run: |
          TARGET=$(bash .github/scripts/detect-tests.sh)
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Detected test target: $TARGET"

      - name: Run selective tests
        env:
          ENV: staging
          CI: true
          NAVIGATION_TIMEOUT: 120000
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STAGING_RESTRICTED_EMAIL: ${{ secrets.STAGING_RESTRICTED_EMAIL }}
          STAGING_RESTRICTED_PASSWORD: ${{ secrets.STAGING_RESTRICTED_PASSWORD }}
          # WHY (2026-09-04): estimate-duration's own git fetch of
          # ci/reporting-history needs this — same root cause as
          # syncHistory.ts's own credential requirement below.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          TARGET="${{ steps.detect.outputs.target }}"
          # WHY: Dynamic workers — 2 for large suites (>50 tests), 1 for small
          TEST_COUNT=$(npx playwright test --project=chromium --list $TARGET 2>/dev/null | grep -c "chromium" || echo "0")
          echo "Test count: $TEST_COUNT"
          if [ "$TEST_COUNT" -gt 50 ]; then
            WORKERS=2
          else
            WORKERS=1
          fi
          # WHY (2026-09-04): bridges this step's dynamically-computed WORKERS
          # to the later "Sync run history" step, which needs the SAME real
          # value to tag this run's own history record correctly (steps don't
          # share shell state — $GITHUB_ENV is the standard GH Actions bridge,
          # same mechanism this file already uses via $GITHUB_OUTPUT for
          # TARGET above).
          echo "COMPUTED_WORKERS=$WORKERS" >> $GITHUB_ENV
          # WHY: Track start time for elapsed time reporting
          START_TIME=$(date +%s)
          echo "⏱️  Started at: $(date '+%H:%M:%S')"
          echo "📋 Test count: $TEST_COUNT | Workers: $WORKERS"
          # WHY a real historical estimate ALSO printed here (2026-09-04), not
          # a replacement for the AVG_SECS formula below: sandbox's own test
          # SCOPE varies wildly run to run (selective, changed-files-based —
          # see "Sync run history"'s own WHY comment on this same caveat for
          # the pass/fail delta feature), so a branch="sandbox"-scoped
          # historical average blends together runs of very different sizes
          # under the same workers value — expect a wide range here, that's
          # inherent to this branch's own selective-run design, not a bug in
          # the estimate mechanism itself.
          BRANCH_NAME=sandbox WORKERS=$WORKERS npm run estimate-duration --silent || true
          # WHY: Estimate completion time — avg 30s per test divided by workers
          AVG_SECS=30
          ESTIMATED_SECS=$(( (TEST_COUNT * AVG_SECS + WORKERS - 1) / WORKERS ))
          ESTIMATED_MINS=$(( ESTIMATED_SECS / 60 ))
          ESTIMATED_END=$(date -d "+${ESTIMATED_SECS} seconds" '+%H:%M:%S' 2>/dev/null || date -v +${ESTIMATED_SECS}S '+%H:%M:%S')
          echo "🕐  Test-count-based estimate: ~${ESTIMATED_MINS} min | ETA: ${ESTIMATED_END}"
          echo "Running: npx playwright test --project=chromium --workers=$WORKERS $TARGET"

          npx playwright test --project=chromium --workers=$WORKERS $TARGET
          EXIT_CODE=$?

          # WHY: Report actual elapsed time after tests complete
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          echo ""
          echo "⏱️  Finished at: $(date '+%H:%M:%S')"
          echo "✅ Total time: ${MINUTES}m ${SECONDS}s"
          echo "📊 Tests: $TEST_COUNT | Workers: $WORKERS | Time: ${MINUTES}m ${SECONDS}s"
          exit $EXIT_CODE

      # WHY: see qa.yml for the full explanation. NOTE: sandbox runs a different,
      # dynamically-selected test subset each time (see Detect Changed Tests
      # above), so its total/passed/failed delta is not apples-to-apples run to
      # run the way a fixed-suite branch's is — the recurring-flaky callout is
      # still meaningful here, but treat the raw pass/fail delta with that caveat.
      - name: Sync run history
        if: always()
        env:
          ENV: staging
          BRANCH_NAME: sandbox
          GITHUB_ACTIONS: 'true'
          REPORT_PATH: reports/playwright-report/results.json
          # WHY (2026-09-04): the real value computed by "Run selective
          # tests" above, bridged via $GITHUB_ENV — see that step's own WHY
          # comment. Falls through to empty (omitted from the record — see
          # syncHistory.ts's own WORKERS-parsing WHY comment) if that step
          # never ran (e.g. "Detect changed tests" itself failed) — never a
          # guessed value.
          WORKERS: ${{ env.COMPUTED_WORKERS }}
          # WHY (2026-08-25): syncHistory.ts's own temp clone needs its own
          # credential — see .claude/known-issues.md's "CI reporting-history
          # ledger" section for the confirmed root cause.
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: npm run history:sync || true

      - name: Send notification email
        if: always()
        env:
          ENV: staging
          BRANCH_NAME: sandbox
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SMTP_HOST: smtp.gmail.com
          GMAIL_SMTP_PORT: '587'
          NOTIFY_ENABLED: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run notify || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-sandbox
          path: reports/playwright-report/
          retention-days: 7
