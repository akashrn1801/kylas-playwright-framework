name: CI — qa (regression)

on:
  push:
    branches: [qa]

jobs:
  run-tests:
    name: playwright-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run regression tests
        env:
          ENV: qa
          CI: true
          NAVIGATION_TIMEOUT: 120000
          QA_APP_URL: ${{ secrets.QA_APP_URL }}
          QA_API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_RESTRICTED_EMAIL: ${{ secrets.QA_RESTRICTED_EMAIL }}
          QA_RESTRICTED_PASSWORD: ${{ secrets.QA_RESTRICTED_PASSWORD }}
        run: |
          START_TIME=$(date +%s)
          echo "⏱️  Started at: $(date '+%H:%M:%S')"
          echo "🕐  Estimated duration: ~42 min"
          npx playwright test --project=chromium --grep @regression --workers=2 --timeout=120000
          EXIT_CODE=$?
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          MINUTES=$((ELAPSED / 60))
          SECONDS=$((ELAPSED % 60))
          echo "✅ Total time: ${MINUTES}m ${SECONDS}s"
          exit $EXIT_CODE

      # WHY: Confirmed live (2026-07-07 reporting overhaul, P2) — must run BEFORE
      # notify so the delta/recurring-flaky file it writes (reports/qa/history-
      # delta.json) exists in time for the email to read it. Never fails the
      # build — syncHistory.ts catches its own errors and always exits 0; `|| true`
      # here is belt-and-suspenders for the rare case node itself fails to start.
      # NOTE: pushing to the dedicated ci/reporting-history branch needs this
      # workflow's checkout to have write access (either `permissions:
      # contents: write` on this job, or a credentialed remote) — this has not
      # been provisioned/verified against the real GitHub remote as part of this
      # change; first real run here should be watched to confirm the push
      # actually succeeds rather than silently no-op'ing every time.
      - name: Sync run history
        if: always()
        env:
          ENV: qa
          GITHUB_ACTIONS: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run history:sync || true

      - name: Send notification email
        if: always()
        env:
          ENV: qa
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_SMTP_HOST: smtp.gmail.com
          GMAIL_SMTP_PORT: '587'
          NOTIFY_ENABLED: 'true'
          REPORT_PATH: reports/playwright-report/results.json
        run: npm run notify || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-qa
          path: reports/playwright-report/
          retention-days: 14

      # WHY: trace.zip/video/screenshots for failed tests land in test-results/
      # (playwright.config.ts outputDir), not reports/playwright-report/ — without
      # this, they're generated on every failure but discarded when the runner
      # tears down, leaving no way to diagnose a failure after the fact.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-test-results-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
